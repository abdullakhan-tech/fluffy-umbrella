name: Deploy Zaythar AI Office demo

on:
  push:
    branches: [main]
    paths:
      - "zaythar-office/**"
      - ".github/workflows/zaythar-office-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "zaythar-office-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload office demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: "zaythar-office"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
