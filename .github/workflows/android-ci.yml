name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Emulator Rules & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Ensure Firebase config exists (restore secret or synthesize CI dummy config)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

          if [ ! -s app/google-services.json ]; then
            echo "::notice::app/google-services.json is missing; generating CI dummy config so Gradle & APK builds proceed and Firebase-dependent emulator tests are skipped."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-no-project",
              "storage_bucket": "demo-no-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.zaythar.zxtmkr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyCiBuildKeyOnly0000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "SKIP_FIREBASE_TESTS=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_FIREBASE_TESTS=false" >> "$GITHUB_ENV"
          fi

          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">demo-database</string>
              <string name="recaptcha_site_key" translatable="false">dummy-recaptcha-site-key</string>
          </resources>
          EOF
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify repository security and modularity invariants
        run: |
          if grep -rnE "signInAnonymously|signInWithEmailAndPassword" app/src/main; then
            echo "Forbidden Firebase auth pattern detected in app/src/main"
            exit 1
          fi
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "File exceeds 500 lines ($lines): $file"
              exit 1
            fi
          done < <(find app/src/main -name "*.kt")

      - name: Install Firebase CLI and Rules Unit Testing
        if: env.SKIP_FIREBASE_TESTS != 'true'
        run: npm install -g firebase-tools @firebase/rules-unit-testing

      - name: Run Firestore rules & Android Robolectric tests under Firebase emulators
        if: env.SKIP_FIREBASE_TESTS != 'true'
        run: |
          NODE_GLOBAL_ROOT="$(npm root -g)"
          firebase emulators:exec \
            --project demo-no-project \
            --only auth,firestore \
            "NODE_PATH=${NODE_GLOBAL_ROOT} FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js && FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 gradle :app:testDebugUnitTest --no-daemon"

      - name: Run non-Firebase unit & UI tests (Firebase tests skipped due to dummy config)
        if: env.SKIP_FIREBASE_TESTS == 'true'
        run: |
          echo "::notice::Skipping Firebase emulator tests because google-services.json was missing; running non-Firebase unit and Compose UI tests."
          SKIP_FIREBASE_TESTS=true gradle :app:testDebugUnitTest -DskipFirebaseTests=true --no-daemon

      - name: Run Android Lint and assemble Debug & Release APKs
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug & Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zaythar-ai-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
