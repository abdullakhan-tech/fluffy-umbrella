name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Emulator Rules & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Prepare Firebase config for CI
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Using repository-provided Firebase Android config."
          else
            echo "::notice::No production Firebase secret supplied. Creating a CI-only dummy Android config; emulator tests still run against local emulators."
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-no-project",
              "storage_bucket": "demo-no-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "com.aistudio.zaythar.zxtmkr"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDummyCiBuildKeyOnly0000000000000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/firebase_applet_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">demo-database</string>
              <string name="recaptcha_site_key" translatable="false">dummy-recaptcha-site-key</string>
          </resources>
          EOF
          fi

          # Firestore rules tests use the default database. Keep CI emulator
          # config isolated from the production database ID in firebase.json.
          cat > firebase-ci.json <<'EOF'
          {
            "firestore": {"rules": "firestore.rules"},
            "emulators": {
              "firestore": {"host": "127.0.0.1", "port": 8085},
              "auth": {"host": "127.0.0.1", "port": 9099},
              "ui": {"enabled": false}
            }
          }
          EOF

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Verify repository security and modularity invariants
        run: |
          if grep -rnE "signInAnonymously|signInWithEmailAndPassword" app/src/main; then
            echo "Forbidden Firebase auth pattern detected in app/src/main"
            exit 1
          fi
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "::warning file=$file::Kotlin source exceeds the 500-line modularity guideline ($lines lines); split it in a focused refactor."
            fi
          done < <(find app/src/main -name "*.kt")

      - name: Install Firebase CLI and Rules Unit Testing
        run: npm install -g firebase-tools @firebase/rules-unit-testing

      - name: Run Firestore rules & Android Robolectric tests under Firebase emulators
        run: |
          NODE_GLOBAL_ROOT="$(npm root -g)"
          firebase emulators:exec             --config firebase-ci.json             --project demo-no-project             --only auth,firestore             "NODE_PATH=${NODE_GLOBAL_ROOT} GCP_PROJECT=demo-no-project FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js && FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 gradle :app:testDebugUnitTest --no-daemon"

      - name: Run Android Lint and assemble Debug & Release APKs
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Remove temporary Firebase CI config
        if: always()
        run: |
          rm -f app/google-services.json firebase-ci.json

      - name: Upload Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug & Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zaythar-ai-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
