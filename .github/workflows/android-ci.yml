name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Emulator Rules & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify repository security and modularity invariants
        run: |
          if grep -rnE "signInAnonymously|signInWithEmailAndPassword" app/src/main; then
            echo "Forbidden Firebase auth pattern detected in app/src/main"
            exit 1
          fi
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "::warning file=$file::Existing Kotlin source is $lines lines; split it in a focused refactor."
            fi
          done < <(find app/src/main -name "*.kt")

      - name: Install Firebase CLI and Rules Unit Testing
        run: npm install -g firebase-tools @firebase/rules-unit-testing

      - name: Run Firestore rules & Android Robolectric tests under Firebase emulators
        run: |
          NODE_GLOBAL_ROOT="$(npm root -g)"
          firebase emulators:exec \
            --project demo-no-project \
            --only auth,firestore \
            "NODE_PATH=${NODE_GLOBAL_ROOT} FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js && FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 gradle :app:testDebugUnitTest --no-daemon"

      - name: Run Android Lint and assemble Debug & Release APKs
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug & Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zaythar-ai-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
