name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Emulator Rules & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify repository security and modularity invariants
        run: |
          if grep -rnE "signInAnonymously|signInWithEmailAndPassword" app/src/main; then
            echo "Forbidden Firebase auth pattern detected in app/src/main"
            exit 1
          fi
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "::warning file=$file::Existing Kotlin source is $lines lines; split it in a focused refactor."
            fi
          done < <(find app/src/main -name "*.kt")

      - name: Install Firebase CLI and Rules Unit Testing
        run: npm install -g firebase-tools @firebase/rules-unit-testing

      - name: Prepare CI-only Firebase config for emulator tests
        id: firebase_config
        shell: bash
        run: |
          if [ -f app/google-services.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "real_config=true" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "zaythar-ci-demo",
              "storage_bucket": "zaythar-ci-demo.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.aistudio.zaythar.zxtmkr"
                }
              },
              "api_key": [{"current_key": "CI_ONLY_NOT_A_REAL_API_KEY"}]
            }],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::Using a temporary CI-only Firebase config; APK packaging requires the real app/google-services.json."
          fi

      - name: Run Firestore rules & Android Robolectric tests under Firebase emulators
        run: |
          NODE_GLOBAL_ROOT="$(npm root -g)"
          firebase emulators:exec \
            --project demo-no-project \
            --only auth,firestore \
            "NODE_PATH=${NODE_GLOBAL_ROOT} FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js && FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 gradle :app:testDebugUnitTest --no-daemon"

      - name: Run Android Lint and assemble Debug & Release APKs
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Explain CI Firebase configuration status
        if: steps.firebase_config.outputs.available == 'false'
        run: |
          echo "::warning::APK build used a temporary CI-only Firebase config. These APKs are compile/test artifacts only and must not be distributed or used against production Firebase."
          echo "### Firebase configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "The real app/google-services.json is not configured. APKs are CI-only and not suitable for production." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Firebase config
        if: always() && steps.firebase_config.outputs.available == 'false'
        run: rm -f app/google-services.json

      - name: Upload Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug & Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zaythar-ai-ci-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
