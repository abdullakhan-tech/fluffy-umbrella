name: Deploy Zaythar AI website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CNAME'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'website/**'
      - 'CNAME'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website files
        run: |
          test -s website/index.html
          test -s website/styles.css
          test -s website/script.js
          test "$(cat CNAME)" = "zaytharai.com"
          grep -q 'https://zaytharai.com/' website/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
