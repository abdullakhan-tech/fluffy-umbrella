name: Package PersonalJarvis source ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/package-personaljarvis.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream PersonalJarvis source
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 3 \
            https://github.com/tbckdev/PersonalJarvis/archive/refs/heads/main.zip \
            -o dist/PersonalJarvis-main.zip
          sha256sum dist/PersonalJarvis-main.zip | tee dist/SHA256SUMS.txt
      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalJarvis-source-bundle
          path: |
            dist/PersonalJarvis-main.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
