name: Package PersonalJarvis source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-personaljarvis.yml"
      - "integrations/PersonalJarvis/**"

permissions:
  contents: read

jobs:
  package:
    name: Download and package upstream source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download upstream PersonalJarvis source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            https://github.com/tbckdev/PersonalJarvis/archive/refs/heads/main.zip \
            -o dist/PersonalJarvis-main.zip
          test -s dist/PersonalJarvis-main.zip
          unzip -tq dist/PersonalJarvis-main.zip
          sha256sum dist/PersonalJarvis-main.zip | tee dist/SHA256SUMS.txt
          du -h dist/PersonalJarvis-main.zip
      - name: Publish downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalJarvis-source-bundle
          path: |
            dist/PersonalJarvis-main.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
