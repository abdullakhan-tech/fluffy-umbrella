name: Android build

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "firestore.rules"
      - "firestore.test.js"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "firestore.rules"
      - "firestore.test.js"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      # Compile-only Firebase config. This placeholder is never a usable Firebase credential.
      - name: Create temporary Firebase compile configuration
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "zaythar-ci-placeholder",
              "storage_bucket": "zaythar-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.aistudio.zaythar.zxtmkr" }
              },
              "api_key": [{ "current_key": "CI_ONLY_NOT_A_REAL_API_KEY" }],
              "oauth_client": [{
                "client_id": "000000000000-ci-placeholder.apps.googleusercontent.com",
                "client_type": 3
              }]
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Set up Node.js for Firebase emulators
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14

      - name: Install Firestore rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Android tests and assemble debug APK with Firebase emulators
        run: >-
          firebase emulators:exec
          --project demo-no-project
          --only auth,firestore
          --non-interactive
          "npm run test:firestore && bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: zaythar-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
